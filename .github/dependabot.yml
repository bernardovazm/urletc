version: 2
updates:
  # npm deps are exact-pinned, so updates are grouped to limit pull request volume.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ['eslint*', 'prettier*', 'typescript*', 'vite*', '@eslint/*', 'globals']
      runtime:
        patterns: ['*']
    ignore:
      # typescript-eslint refuses to load against the TS 7.0 API, so a grouped bump to
      # TS 7 fails Lint and blocks the other eight updates in the same pull request.
      # Drop this entry once typescript-eslint supports TS >= 7.1.
      - dependency-name: typescript
        versions: ['>=7.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
