version: 2
updates:
  # npm deps are exact-pinned, so updates are grouped to limit pull request volume.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ['eslint*', 'prettier*', 'typescript*', 'vite*', '@eslint/*', 'globals']
      runtime:
        patterns: ['*']
    ignore:
      # typescript-eslint refuses to load against the TS 7.0 API, so a grouped bump to
      # TS 7 fails Lint and blocks the other eight updates in the same pull request.
      # Drop this entry once typescript-eslint supports TS >= 7.1.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # From 0.25.4 the Nostr adapter closes a relay for the rest of the page's life on its
      # first rejected event, backs announcing off for up to 15 minutes on a rate limit, and
      # announces once a minute after warmup instead of every 5.3 s. With three relays, a
      # tab left open all day can lose every relay and stop finding peers.
      - dependency-name: trystero
        versions: ['>=0.25.4']
  # The actions share one workflow file and one CI run, so one pull request covers them all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
