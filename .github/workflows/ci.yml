name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in this workflow writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: End-to-end (Playwright)
        env:
          E2E_WITH_DEPS: '1'
          # The Build step above already produced dist/, so rebuilding inside the script
          # would only re-run the same build against the same tree.
          E2E_SKIP_BUILD: '1'
        run: bash scripts/e2e.sh

      # When the preview server fails to boot, the suite can only report that it did not
      # come up. The reason is in this log.
      - name: Preview server log
        if: failure()
        run: cat /tmp/urletc-e2e-preview.log || true
