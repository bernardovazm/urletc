<!doctype html><html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; connect-src 'none'; style-src 'none'">
</head><body><script>
// Workshop script guest (src/workshop/sandbox.ts). Static: the untrusted source arrives by
// postMessage after 'ready' and is never interpolated into this markup. Served from its own
// URL with its own CSP header, because a blob: or srcdoc guest inherits the host policy,
// whose script-src refuses this inline bootstrap.
(function(){
  // Only a sandboxed frame has an opaque origin and a parent. Opened any other way (top
  // level, or unsandboxed from a server that sends no CSP) this document has the app's
  // origin, so it must never listen for code to run.
  if (self.origin !== 'null' || parent === self) return;
  // CSP connect-src 'none' does not govern WebRTC, so a guest could exfiltrate over
  // ICE/STUN/TURN or DNS. Poison the WebRTC constructors before the untrusted source,
  // delivered later via the 'exec' message, ever runs. Browser-enforced and independent
  // of CSP.
  try {
    ['RTCPeerConnection','webkitRTCPeerConnection','mozRTCPeerConnection','RTCDataChannel'].forEach(function(n){
      try { delete window[n]; } catch(e){}
      try { Object.defineProperty(window, n, { configurable:false, get:function(){ throw new Error('network is blocked in the sandbox'); } }); } catch(e){}
    });
  } catch(e){}
  // A child frame is a realm of its own with an unpoisoned RTCPeerConnection, and CSP
  // governs neither srcdoc nor about:blank navigations, so the guest gets no frames: one
  // inserted by any route is detached at the next microtask checkpoint, before its
  // navigation can commit. Every shadow root is watched the same way as the document.
  // Declarative shadow roots and document.open/write would put an insertion where the
  // observer does not look, so those are refused. Everything the observer calls is captured
  // here, before untrusted code can redefine it.
  try {
    var apply = Reflect.apply, gd = Object.getOwnPropertyDescriptor;
    var addedNodes = gd(MutationRecord.prototype, 'addedNodes').get, listLen = gd(NodeList.prototype, 'length').get;
    var listItem = NodeList.prototype.item, nodeType = gd(Node.prototype, 'nodeType').get;
    var matches = Element.prototype.matches, qsa = Element.prototype.querySelectorAll, detach = Element.prototype.remove;
    var observe = MutationObserver.prototype.observe, attachShadow = Element.prototype.attachShadow;
    var FRAMES = 'iframe,frame,object,embed,portal,fencedframe', WATCH = { childList: true, subtree: true };
    var each = function(list, f){ for (var i = apply(listLen, list, []) - 1; i >= 0; i--) f(apply(listItem, list, [i])); };
    var strip = function(n){
      if (apply(nodeType, n, []) !== 1) return;
      if (apply(matches, n, [FRAMES])) return void apply(detach, n, []);
      each(apply(qsa, n, [FRAMES]), function(f){ apply(detach, f, []); });
    };
    var watcher = new MutationObserver(function(recs){ for (var r = 0; r < recs.length; r++) each(apply(addedNodes, recs[r], []), strip); });
    apply(observe, watcher, [document, WATCH]);
    var lock = function(o, n, v){ try { Object.defineProperty(o, n, { configurable: false, writable: false, value: v }); } catch(e){} };
    // A new shadow root is empty, so watching it from here on covers everything put in it.
    lock(Element.prototype, 'attachShadow', function(){ var root = apply(attachShadow, this, arguments); apply(observe, watcher, [root, WATCH]); return root; });
    var refuse = function(o, names){ names.forEach(function(n){ lock(o, n, function(){ throw new Error(n + ' is not available in the sandbox'); }); }); };
    refuse(Element.prototype, ['setHTMLUnsafe']);
    if (typeof ShadowRoot !== 'undefined') refuse(ShadowRoot.prototype, ['setHTMLUnsafe']);
    refuse(Document.prototype, ['open', 'write', 'writeln']);
    refuse(Document, ['parseHTMLUnsafe']);
  } catch(e){}
  var seq=0, pending={};
  function call(method, args){ return new Promise(function(res,rej){ var id=++seq; pending[id]={res:res,rej:rej}; parent.postMessage({k:'cap', id:id, method:method, args:args}, '*'); }); }
  var host = {
    clipboard: { read:function(){return call('clipboard.read',[]);}, write:function(t){return call('clipboard.write',[String(t)]);} },
    storage: { get:function(key){return call('storage.get',[String(key)]);}, set:function(key,val){return call('storage.set',[String(key),val]);} },
    net: { fetch:function(url,init){return call('net.fetch',[String(url), init||{}]);} },
    log: function(m){ try{ parent.postMessage({k:'log', msg:String(m)}, '*'); }catch(e){} }
  };
  function safe(v){ try{ return JSON.parse(JSON.stringify(v===undefined?null:v)); }catch(e){ return String(v); } }
  window.addEventListener('message', function(e){
    if (e.source !== parent) return;
    var d=e.data||{};
    if(d.k==='exec'){
      (async function(){
        try{
          var fn = new Function('host','"use strict"; return (async function(){\n'+d.source+'\n})();');
          var value = await fn(host);
          parent.postMessage({k:'done', value: safe(value)}, '*');
        }catch(err){ parent.postMessage({k:'error', error: String(err && err.message || err)}, '*'); }
      })();
    } else if(d.k==='cap-result'){
      var p=pending[d.id]; if(p){ delete pending[d.id]; if(d.ok){ p.res(d.value); } else { p.rej(new Error(d.error)); } }
    }
  });
  parent.postMessage({k:'ready'}, '*');
})();
</script></body></html>
